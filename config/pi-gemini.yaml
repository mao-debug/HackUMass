# Select --gemini-detect explicitly to send one snapshot to Google.
camera:
  source: picamera2
  width: 1280
  height: 960
  fps: 5.0
  startup_timeout_s: 30.0
  capture_timeout_s: 5.0
  settle_s: 1.0
  autofocus: single_if_supported
  autofocus_timeout_s: 4.0
simulation:
  max_frames: 1
  preview: false
models:
  object_detection_backend: gemini
  text_to_speech_backend: espeak_ng
detection:
  max_detections: 10
cloud:
  model: gemini-3.5-flash-lite
  timeout_s: 15.0
  max_image_edge: 1024
  detection_max_output_tokens: 1024
