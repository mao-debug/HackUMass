# Sample pixels and invented proximity; no microphone opens until M.
# For Mac replay, pass --command-audio /path/to/your-command.wav; no audio asset is bundled.
camera:
  source: sample
  width: 640
  height: 480
  fps: 30.0
simulation:
  max_frames: 1
  preview: false
models:
  object_detection_backend: none
  scene_description_backend: gemini
  ocr_backend: gemini
  speech_recognition_backend: gemini
cloud:
  model: gemini-3.5-flash-lite
  timeout_s: 60.0
  max_output_tokens: 256
  ocr_max_output_tokens: 2048
  max_image_edge: 1024
  live_interval_s: 5.0
ocr:
  timeout_s: 60.0
  preprocess: none
speech:
  max_words: 60
  timeout_s: 45.0
proximity:
  backend: fixture
  fixture_path: ../examples/proximity-fixture.json
  poll_hz: 5.0
  response_timeout_s: 0.4
  stale_after_s: 0.5
  nearby_mm: 1000
voice:
  device: pulse
  record_seconds: 5
  timeout_s: 30.0
  model: null
  audio_path: null
