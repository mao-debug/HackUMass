# Pi 4/Pi 5 with Camera Module 3 (IMX708): Picamera2 capture and OpenCV CPU inference.
# Obtain the local model explicitly first; see docs/models.md. No downloads at startup.
camera:
  source: picamera2
  width: 640
  height: 480
  fps: 2.0
  startup_timeout_s: 30.0
  capture_timeout_s: 5.0
models:
  object_detection_backend: opencv_ssd
  object_detection_path: ../models/mobilenet-ssd/mobilenet_iter_73000.caffemodel
  object_detection_config_path: ../models/mobilenet-ssd/deploy.prototxt
simulation:
  max_frames: 20
  preview: false
detection:
  confidence_threshold: 0.55
  max_detections: 10
