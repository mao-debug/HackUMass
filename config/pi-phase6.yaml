# New assets remain optional downloads. Confirm paths and recovery keyboard first.
# No cloud work starts from configuration: --assistant --cloud is explicit.
camera:
  source: picamera2
  width: 1280
  height: 960
  fps: 15.0
  startup_timeout_s: 30.0
  capture_timeout_s: 5.0
  settle_s: 1.0
  autofocus: single_if_supported
  autofocus_timeout_s: 4.0
simulation:
  preview: false
models:
  object_detection_backend: none
  scene_description_backend: gemini
  ocr_backend: gemini
  speech_recognition_backend: gemini
  text_to_speech_backend: piper
cloud:
  model: gemini-3.5-flash-lite
  timeout_s: 60.0
  live_interval_s: 5.0
  max_image_edge: 1024
  ocr_max_output_tokens: 2048
speech:
  max_words: 100
  timeout_s: 60.0
  piper_python_path: ../.venv-tts/bin/python
  piper_model_path: ../models/piper/en_US-ljspeech-medium.onnx
  gemini_model: gemini-3.8-flash-lite-tts
  gemini_voice: Charon
  gemini_style: Clear, calm, conversational.
voice:
  device: pulse
  record_seconds: 5
  timeout_s: 30.0
chess:
  backend: gemini
  orientation: white_near
  automatic: false
  observation_max_age_s: 30.0
  calibration_path: ../artifacts/chess-calibration.json
assistant:
  wake_model_dir_path: ../models/wake/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
  wake_keywords_path: ../models/wake/keywords.txt
  wake_threshold: 0.25
  keyboard_device_path: null
  photo_dir_path: ../artifacts/photos
  frame_max_age_s: 2.0
# ESP32 can be disconnected during camera/audio/chess development.
proximity:
  backend: disabled
