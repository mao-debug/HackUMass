[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vidi"
version = "0.1.0"
description = "Camera scenes, local proximity, printed-text reading, and speech for vidi smart glasses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
desktop = ["numpy>=1.26,<3", "opencv-python>=4.10,<5"]
# SDK 2.34 retry-option behavior is covered by offline transport tests.
gemini = ["google-genai==2.34.0"]
sensors = ["pyserial==3.5"]
chess = ["chess==1.11.2"]

[project.scripts]
vidi = "vidi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
