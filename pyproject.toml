[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidi"
version = "0.1.0"
description = "Local simulation foundation for the vidi smart glasses prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
vidi = "vidi.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
